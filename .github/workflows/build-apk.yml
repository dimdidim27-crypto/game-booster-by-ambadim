name: Build Game Booster APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip GAME_BOOSTER_BY_AMBADIM_ANDROID_PROJECT.zip

      - name: Build APK
        run: gradle -p GameBoosterByAmbadim assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: GAME-BOOSTER-APK
          path: GameBoosterByAmbadim/app/build/outputs/apk/debug/app-debug.apk
